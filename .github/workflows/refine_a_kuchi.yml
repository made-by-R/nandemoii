name: Refine a and kuchi pages

on:
  push:
    paths:
      - '.github/workflows/refine_a_kuchi.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine SEO and trust signals
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def replace_meta(doc, attr, key, value):
              pattern = rf'(<meta[^>]+{attr}=["\']{re.escape(key)}["\'][^>]+content=["\'])(.*?)(["\'][^>]*>)'
              if re.search(pattern, doc, flags=re.I|re.S):
                  return re.sub(pattern, lambda m: m.group(1)+value+m.group(3), doc, count=1, flags=re.I|re.S)
              return doc

          def add_before_head(doc, block):
              return re.sub(r'</head>', block + '\n</head>', doc, count=1, flags=re.I)

          # /a — keyboard article
          p = Path('a.html')
          doc = p.read_text(encoding='utf-8')
          new_title = '静音パンタグラフキーボードおすすめ4選｜オフィス・Web会議向け【2026】｜萬洋紹介館'
          desc = '静音パンタグラフキーボード4機種を、配列・サイズ・接続方式・使い方で比較。オフィスやWeb会議、夜間作業で打鍵音を抑えたい人向けに選び方を整理します。'
          doc = re.sub(r'<title>.*?</title>', f'<title>{new_title}</title>', doc, count=1, flags=re.I|re.S)
          doc = replace_meta(doc, 'name', 'description', desc)
          doc = replace_meta(doc, 'property', 'og:title', new_title)
          doc = replace_meta(doc, 'property', 'og:description', desc)
          doc = replace_meta(doc, 'name', 'twitter:title', new_title)
          doc = replace_meta(doc, 'name', 'twitter:description', desc)
          doc = doc.replace('href="https://note.com"', 'href="https://note.com/lively_yeti9225"')
          extra = []
          if 'property="og:image:width"' not in doc:
              extra += [
                  '  <meta property="og:image:width" content="1200">',
                  '  <meta property="og:image:height" content="630">',
                  '  <meta property="og:image:alt" content="静音パンタグラフキーボードおすすめ4選の表紙">',
                  '  <meta name="twitter:image:alt" content="静音パンタグラフキーボードおすすめ4選の表紙">',
              ]
          if '"@type":"Article"' not in doc and '"@type": "Article"' not in doc:
              data = {
                  '@context':'https://schema.org','@type':'Article',
                  'headline':'静音パンタグラフキーボードおすすめ4選｜オフィス・Web会議向け【2026】',
                  'description':desc,'mainEntityOfPage':'https://11gor.com/a',
                  'image':'https://11gor.com/images/og/a.png','dateModified':'2026-09-30',
                  'author':{'@type':'Organization','name':'萬洋紹介館','url':'https://11gor.com/about'},
                  'publisher':{'@type':'Organization','name':'萬洋紹介館','url':'https://11gor.com/'},
              }
              extra.append('  <script type="application/ld+json">'+json.dumps(data, ensure_ascii=False, separators=(',',':'))+'</script>')
          if extra:
              doc = add_before_head(doc, '\n'.join(extra))
          p.write_text(doc, encoding='utf-8')

          # /kuchi — lip dryness article
          p = Path('kuchi.html')
          doc = p.read_text(encoding='utf-8')
          new_title = '唇の乾燥レベルを写真で比較｜セルフチェックと保湿ケアの目安｜萬洋紹介館'
          desc = '唇の乾燥状態を写真で比較し、見た目の特徴と保湿ケアの目安を整理。セルフチェックは参考情報として使い、痛み・出血・長引く症状がある場合は医療機関への相談を検討してください。'
          doc = re.sub(r'<title>.*?</title>', f'<title>{new_title}</title>', doc, count=1, flags=re.I|re.S)
          if not re.search(r'<meta[^>]+name=["\']description["\']', doc, flags=re.I):
              doc = doc.replace(f'<title>{new_title}</title>', f'<title>{new_title}</title>\n    <meta name="description" content="{desc}">\n    <link rel="canonical" href="https://11gor.com/kuchi">', 1)
          else:
              doc = replace_meta(doc, 'name', 'description', desc)
              if 'rel="canonical"' not in doc:
                  doc = doc.replace(f'<title>{new_title}</title>', f'<title>{new_title}</title>\n    <link rel="canonical" href="https://11gor.com/kuchi">', 1)
          doc = replace_meta(doc, 'property', 'og:title', new_title)
          doc = replace_meta(doc, 'property', 'og:description', desc)
          doc = replace_meta(doc, 'name', 'twitter:title', new_title)
          doc = replace_meta(doc, 'name', 'twitter:description', desc)

          replacements = {
              '完全実物写真ガイド＆リアルタイム診断':'写真比較ガイド＆リアルタイム目安',
              '実物写真ランク＆レベル別治療ケア':'実物写真ランク＆レベル別保湿ケア',
              '写真判定セルフチェック':'写真で確認するセルフチェック',
              '診定します。':'見た目の目安として整理します。',
              '唇の推定水分含有量 (Hydration Rate)':'乾燥度の参考目安',
              '推定ステータス':'参考ステータス',
              '推奨されるケア処方':'ケアの参考目安',
              '処方ケア':'ケアの目安',
          }
          for old,new in replacements.items():
              doc = doc.replace(old,new)

          if '医療診断ではありません' not in doc:
              pat = r'(<p class="text-gray-600 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed mb-8">.*?</p>)'
              note = '\n                <p class="max-w-2xl mx-auto -mt-4 mb-8 text-xs sm:text-sm text-rose-800 bg-white/80 border border-rose-200 rounded-2xl px-4 py-3">※写真やスライダーは見た目の参考であり、医療診断ではありません。痛み・出血・腫れ・長引く症状がある場合は、医療機関への相談を検討してください。</p>'
              doc = re.sub(pat, lambda m: m.group(1)+note, doc, count=1, flags=re.I|re.S)

          extra = []
          if 'property="og:image:width"' not in doc:
              extra += [
                  '  <meta property="og:image:width" content="1200">',
                  '  <meta property="og:image:height" content="630">',
                  '  <meta property="og:image:alt" content="唇の乾燥レベルを写真で比較する記事の表紙">',
                  '  <meta name="twitter:image:alt" content="唇の乾燥レベルを写真で比較する記事の表紙">',
              ]
          if '"@type":"Article"' not in doc and '"@type": "Article"' not in doc:
              data = {
                  '@context':'https://schema.org','@type':'Article',
                  'headline':'唇の乾燥レベルを写真で比較｜セルフチェックと保湿ケアの目安',
                  'description':desc,'mainEntityOfPage':'https://11gor.com/kuchi',
                  'image':'https://11gor.com/images/og/kuchi.png','dateModified':'2026-09-30',
                  'author':{'@type':'Organization','name':'萬洋紹介館','url':'https://11gor.com/about'},
                  'publisher':{'@type':'Organization','name':'萬洋紹介館','url':'https://11gor.com/'},
              }
              extra.append('  <script type="application/ld+json">'+json.dumps(data, ensure_ascii=False, separators=(',',':'))+'</script>')
          if extra:
              doc = add_before_head(doc, '\n'.join(extra))
          p.write_text(doc, encoding='utf-8')
          PY
      - name: Commit page refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add a.html kuchi.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Refine SEO and trust signals for a and kuchi'
            git push
          fi
