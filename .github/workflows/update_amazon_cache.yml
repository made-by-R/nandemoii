name: Update Amazon Product Cache

on:
  schedule:
    - cron: '0 15 * * *' # 毎日日本時間 0:00 (UTC 15:00) に自動実行
  workflow_dispatch:      # 手動実行ボタンを有効化

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Amazon Data
        env:
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: node fetch_amazon_data.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add amazon_products_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Amazon product cache [skip ci]" && git push)
