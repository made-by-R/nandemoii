<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="24" fill="#f4efe6"/><g font-family="sans-serif" fill="#483c30"><text x="48" y="66" font-size="26">ブランド服を手放す前の3ステップ</text><rect x="40" y="106" width="270" height="260" rx="16" fill="#fff"/><circle cx="175" cy="163" r="30" fill="#705b40"/><text x="175" y="173" text-anchor="middle" fill="white" font-size="28">1</text><text x="175" y="242" text-anchor="middle" font-size="25">確認</text><text x="175" y="291" text-anchor="middle" font-size="19">ブランド・状態</text><text x="175" y="325" text-anchor="middle" font-size="17" fill="#736454">送れる品物か調べる</text><rect x="345" y="106" width="270" height="260" rx="16" fill="#fff"/><circle cx="480" cy="163" r="30" fill="#705b40"/><text x="480" y="173" text-anchor="middle" fill="white" font-size="28">2</text><text x="480" y="242" text-anchor="middle" font-size="25">記録</text><text x="480" y="291" text-anchor="middle" font-size="19">写真・付属品</text><text x="480" y="325" text-anchor="middle" font-size="17" fill="#736454">発送前の状態を残す</text><rect x="650" y="106" width="270" height="260" rx="16" fill="#fff"/><circle cx="785" cy="163" r="30" fill="#705b40"/><text x="785" y="173" text-anchor="middle" fill="white" font-size="28">3</text><text x="785" y="242" text-anchor="middle" font-size="25">判断</text><text x="785" y="291" text-anchor="middle" font-size="19">査定・返送条件</text><text x="785" y="325" text-anchor="middle" font-size="17" fill="#736454">納得してから手放す</text></g></svg>